<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102A43">
  <meta name="description" content="行動版 119 模擬報案訓練工具，隨機產生案件並提供互動對話與講評。">
  <title>119 情境演練室</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="./scenarios.js"></script>
  <script src="./app-v2.js" defer></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#" aria-label="回到首頁">
      <span class="brand-mark" aria-hidden="true">119</span>
      <span><b>情境演練室</b><small>CASE CALL LAB</small></span>
    </a>
    <button class="icon-button" id="openHelp" type="button" aria-label="使用說明">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.7 9a2.4 2.4 0 1 1 3.5 2.1c-.8.4-1.2.9-1.2 1.9M12 17h.01"/></svg>
    </button>
  </header>

  <main id="app" class="app-shell" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="主要導覽">
    <button class="nav-item is-active" type="button" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20h-5v-6H9v6H4Z"/></svg><span>演練</span>
    </button>
    <button class="nav-item" type="button" data-nav="history">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h12a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2ZM5 4v14a2 2 0 0 1 2-2h12M9 8h6M9 12h5"/></svg><span>紀錄</span>
    </button>
    <button class="nav-item" type="button" data-nav="guide">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path d="M12 7v5l3 2"/></svg><span>要點</span>
    </button>
  </nav>

  <dialog id="helpDialog" class="modal">
    <form method="dialog">
      <div class="modal-head"><span class="eyebrow">使用說明</span><button class="close-button" aria-label="關閉">×</button></div>
      <h2>把每一次通話，練成可靠反應</h2>
      <ol class="steps-list">
        <li><b>抽取案件</b><span>系統會隨機組合地點、傷況與現場危害。</span></li>
        <li><b>完成對話</b><span>閱讀報案者訊息，選擇最合適的回應。</span></li>
        <li><b>查看講評</b><span>對照完整逐字稿、隱藏情資與應核事項。</span></li>
      </ol>
      <p class="notice-box">本工具僅供教育演練，所有姓名、地址與案件均為虛構；不取代正式勤務規範。</p>
      <button class="primary-button full" value="close">了解，開始演練</button>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
